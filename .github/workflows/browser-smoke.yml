name: Browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test real UI in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ae1m-http.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true,viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
            await page.getByRole('button',{name:/Mon entreprise/}).click();
            assert(await page.getByText('Mon entreprise · administration française').isVisible());
            const count=await page.locator('.official-link').count();
            assert(count>=15,'Expected official portals, got '+count);
            await page.locator('#aeName').fill('Entreprise test');
            await page.locator('#aeSiret').fill('12345678901234');
            await page.locator('#saveProfile').click();
            await page.locator('#cashLabel').fill('Prestations test');
            await page.locator('#cashAmount').fill('850');
            await page.locator('#addCash').click();
            assert((await page.locator('#totalIn').innerText()).includes('850'));
            await page.getByRole('button',{name:/Mission/}).click();
            await page.locator('#missionInput').fill('Non-conformité qualité, défaut, impôts et URSSAF');
            await page.locator('#autoSelect').click();
            assert((await page.locator('.agent-card').count())>=4,'Agents not generated');
            await page.locator('#startMission').click();
            assert(await page.locator('#missionResult').isVisible());
            await page.getByRole('button',{name:/Fichiers/}).click();
            await page.locator('#filesInput').setInputFiles({name:'exemple.csv',mimeType:'text/csv',buffer:Buffer.from('nom;montant\nClient A;85')});
            await page.waitForFunction(()=>document.getElementById('fileCountTop').textContent==='1');
            await page.getByRole('button',{name:/Exports/}).click();
            const [download]=await Promise.all([page.waitForEvent('download'),page.locator('#exportZip').click()]);
            assert(download.suggestedFilename().endsWith('.zip'));
            assert.deepEqual(errors,[], 'Unexpected JS errors: '+errors.join('; '));
            console.log('Browser smoke passed: '+count+' official portals, mission, ledger, import, ZIP.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
